<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Project</title>
	<link rel="stylesheet" th:href="@{/css/admin.css}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
	<div th:insert="~{fragments/header}"></div>
	<div class="container container-list">
		<div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
		<div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
		<div class="row">
			<div class="col-1">
			    <form th:action="@{/admin}">
					<button class="btn btn-light" type="submit">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16" transform="translate(0, -1)">
						  <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
						</svg>
						Back
					</button>
			    </form>
			</div>
		</div>
		
		<div class="row">
			<h1>Projects List</h1>
		</div>
    	
		<div class="row">
			<div class="col-lg-3">
				<a th:href="@{/admin-project/new}" class="btn btn-primary btn-sm mb-3">Add Project</a>
			</div>
		</div>
		
		<table class="table table-striped table-bordered">
		    <thead class="table-dark">
		        <tr>
		            <th>Name</th>
		            <th>Event</th>
		            <th>Description</th>
					<th>Location</th>
					<th>Capacity</th>
					<th>Image Url</th>
					<th>Actions</th>
		        </tr>
		    </thead>
			
		    <tbody>
			        <tr th:each="project : ${projects}">
			            <td th:text="${project.name}"></td>
						<td th:text="${project.event}"></td>
						<td th:text="${project.description}"></td>
						<td th:text="${project.location}"></td>
						<td th:text="${project.capacity}"></td>
						<td th:text="${project.imageUrl}"></td>
			            <td>
							<a th:href = "@{/admin-project/edit/{id}(id=${project.id})}" class="btn btn-primary">Update</a>
							<a th:href = "@{/admin-project/{id}(id=${project.id})}" class="btn btn-danger" onclick="return confirmDelete()">Delete</a>
							<script>
							  function confirmDelete() {
							    return confirm("Are you sure you want to delete this item?");
							  }
							</script>
						</td>
			        </tr>
			    </tb>
			</tbody>
		</table>
	</div>
	<div th:insert="~{fragments/footer}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
	    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
	    crossorigin="anonymous"></script>
</body>
</html>
