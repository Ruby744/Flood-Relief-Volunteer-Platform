<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Donation Success</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
	    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
	    crossorigin="anonymous">
</head>
<body>
	<div th:insert="~{fragments/header}"></div>
    <div class="container mt-5">
        <div class="bg-light p-5 my-5 rounded text-center">
            <h1 class="display-4">Donation Successful!</h1>
            <p class="lead">Thank you for your donation, <span th:text="${donation.user.firstName}">Name</span>.</p>
        </div>

        <div class="card">
            <div class="card-header bg-danger text-white">
                <h3>Your Donation Details:</h3>
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Type: <span th:text="${donation.type}">Type</span></li>
                    <li class="list-group-item">Amount: <span th:text="${donation.amount != null ? donation.amount : 'N/A'}">Amount</span></li>
                    <li class="list-group-item">Description: <span th:text="${donation.description != null ? donation.description : 'N/A'}">Description</span></li>
                    <li class="list-group-item">Quantity: <span th:text="${donation.quantity != null ? donation.quantity : 'N/A'}">Quantity</span></li>
                    <li class="list-group-item">Place: <span th:text="${donation.place != null ? donation.place.name : 'N/A'}">Place ID</span></li>
                </ul>
            </div>
        </div>

        <div class="text-center my-5">
            <a href="/home" class="btn btn-primary">Go Back to Home</a>
			<br>
        </div>
    </div>

	<div th:insert="~{fragments/footer}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
	    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
	    crossorigin="anonymous"></script></body>
</html>
