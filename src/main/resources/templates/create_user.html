<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Create User</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link rel="stylesheet" th:href="@{/css/admin.css}">
	</head>
	
	<body>
		<div th:insert="~{fragments/header}"></div>
		<div class="container form-container">
			<div class="row">
			    <form th:action="@{/admin-user}">
					<button class="btn btn-light" type="submit">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16" transform="translate(0, -1)">
						  <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
						</svg>
						Back
					</button>
			    </form>	
			</div>
			<div class="row">
				<h2>New User</h2>
				<div class="card-body">
					<form th:action="@{/admin-user}" th:object="${user}" method="POST">
						<div class="form-group">
						    <label for="title">Title</label>
						    <select
						        id="title"
						        name="title"
						        th:field="*{title}"
						        class="form-control"
								required>
						        <option value="" disabled selected>Select Title</option>
						        <option value="Mr">Mr</option>
						        <option value="Mrs">Mrs</option>
						        <option value="Miss">Miss</option>
						        <option value="Dr">Dr</option>
						        <option value="Prof">Prof</option>
						    </select>
						</div>

						<div class="form-group">
							<label>First Name</label>
							<input
								type="text"
								name="firstName"
								th:field="*{firstName}"
								class="form-control"
								placeholder="Enter First Name"
								required/>
						</div>
					
						<div class="form-group">
							<label>Last Name</label>
							<input
								type="text"
								name="lastName"
								th:field="*{lastName}"
								class="form-control"
								placeholder="Enter Last Name"
								required/>
						</div>
						
						<div class="form-group">
							<label>Email</label>
							<input
								type="email"
								name="email"
								th:field="*{email}"
								class="form-control"
								placeholder="Enter Email"
								required/>
						</div>
			
						<div class="form-group">
							<label>Phone</label>
							<input
								type="text"
								name="phone"
								th:field="*{phone}"
								class="form-control"
								placeholder="Enter Phone Number"
								required/>
						</div>

						<div class="form-group">
							<label>Country</label>
							<input
								type="text"
								name="country"
								th:field="*{country}"
								class="form-control"
								placeholder="Enter Country"
								required/>
						</div>

						<div class="form-group">
							<label>City</label>
							<input
								type="text"
								name="city"
								th:field="*{city}"
								class="form-control"
								placeholder="Enter City"
								required/>
						</div>

						<div class="form-group">
							<label>Building</label>
							<input
								type="text"
								name="building"
								th:field="*{building}"
								class="form-control"
								placeholder="Enter Building"
								required/>
						</div>

						<div class="form-group">
							<label>Street</label>
							<input
								type="text"
								name="street"
								th:field="*{street}"
								class="form-control"
								placeholder="Enter Street"
								required/>
						</div>

						<div class="form-group">
							<label>Postal</label>
							<input
								type="text"
								name="postal"
								th:field="*{postal}"
								class="form-control"
								placeholder="Enter Postal"
								required/>
						</div>

						<button type="submit" class="btn btn-primary">Submit</button>
					</form>
				</div>
			</div>
		</div>
		<div th:insert="~{fragments/footer}"></div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
		    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
		    crossorigin="anonymous"></script>
	</body>
</html>
