<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flood Volunteer Events in Malaysia</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
	    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
	    crossorigin="anonymous">
    <style>
        .volunteer {
            align-items: center;
            justify-content: center;

			padding: 20px;
        }

        .event-card {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
			height: 100%;
        }
		.card {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			height: 100%;
		}
        .card-body {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
			justify-content: space-between;
        }
		.register-btn {
			margin-top: auto;
		}
        .registration-form {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-out;
            margin-top: 15px;
        }
        .registration-form.show {
            max-height: 1000px;
            transition: max-height 0.5s ease-in;
        }
    </style>
</head>
<body>
	<div th:insert="~{fragments/header}"></div>
    <div class="container volunteer">

        <h1 class="text-center mb-4">Flood Volunteer Events in Malaysia</h1>

        <div th:if="${successMessage}" class="alert alert-success text-center">
            <span th:text="${successMessage}">Registration successful!</span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger text-center">
            <span th:text="${errorMessage}">Error message</span>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4 d-flex">
            <div class="col" th:each="project : ${projects}">
                <div class="card event-card">
                    <img th:src="${project.imageUrl}" class="card-img-top" alt="Event Image">

                    <div class="card-body">
                        <h5 class="card-title" th:text="${project.event}">Event Title</h5>
                        <p class="card-text" th:text="${project.description}">Description</p>
                        <p class="card-text">
                            <strong>Location:</strong> <span th:text="${project.location}"></span>
                        </p>
                        <p class="card-text">
                            <strong>Capacity:</strong> <span class="capacity-count" th:text="${project.capacity}" 
                            th:data-event-id="${project.id}"></span>
                        </p>

                        <button class="btn btn-primary register-btn" 
                                th:data-event-id="${project.id}"
								th:data-form-id="${'form-' + project.id}"
                                th:disabled="${project.capacity <= 0}"
                                onclick="toggleForm(this)">
                            Register
                        </button>

                        <!-- Registration Form -->
                        <form class="registration-form mt-3"
							  th:id="${'form-' + project.id}"
                              th:action="@{/api/events/{eventId}/register(eventId=${project.id})}"
                              method="post">
							  <input type="hidden" name="placeId" th:value="${project.id}" />
                            <div class="col-12">
                                <label>Title:</label>
                                <select class="form-select" name="title" required>
                                    <option value="">Select Title</option>
                                    <option value="Mr">Mr</option>
                                    <option value="Mrs">Mrs</option>
                                    <option value="Ms">Ms</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Last Name:</label>
                                <input type="text" class="form-control" name="lastName" required>
                            </div>

                            <div class="mb-3">
                                <label>First Name:</label>
                                <input type="text" class="form-control" name="firstName" required>
                            </div>

                            <div class="mb-3">
                                <label>Phone:</label>
                                <input type="tel" class="form-control" name="phone" 
                                       pattern="[0-9]+" placeholder="0123456789" required>
                            </div>

                            <div class="mb-3">
                                <label>Email:</label>
                                <input type="email" class="form-control" name="email" required>
                            </div>

                            <div class="mb-3">
                                <label>Help us with:</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="skills" value="Leadership" id="skillLeadership">
                                    <label class="form-check-label" for="skillLeadership">Leadership</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="skills" value="First Aid" id="skillFirstAid">
                                    <label class="form-check-label" for="skillFirstAid">First Aid</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="skills" value="Cooking" id="skillCooking">
                                    <label class="form-check-label" for="skillCooking">Cooking</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="skills" value="Driving" id="skillDriving">
                                    <label class="form-check-label" for="skillDriving">Driving</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="skills" value="Cleaning" id="skillCleaning">
                                    <label class="form-check-label" for="skillCleaning">Cleaning</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label>Address:</label>

                                <div class="mb-2">
									<select id="country" class="form-select" name="country" required>		        
									    <option value="" disabled selected>Choose Country</option>
										<option value="Malaysia" th:selected="${country == 'Malaysia'}">Malaysia</option>
									    <option value="Indonesia" th:selected="${country == 'Indonesia'}">Indonesia</option>
									    <option value="Singapore" th:selected="${country == 'Singapore'}">Singapore</option>
									</select>
                                </div>

                                <div class="col-12 mb-2">
                                    <select class="form-select" name="state" id="state" required>
                                        <option selected disabled value="">Choose State</option>
                                        <option value="Sabah">Sabah</option>
                                        <option value="Johor">Johor</option>
                                        <option value="Pahang">Pahang</option>
                                        <option value="Perak">Perak</option>
                                        <option value="Penang">Penang</option>
                                        <option value="Negeri_Sembilan">Negeri Sembilan</option>
                                        <option value="Terengganu">Terengganu</option>
                                        <option value="Kelantan">Kelantan</option>
                                        <option value="Selangor">Selangor</option>
                                        <option value="Kedah">Kedah</option>
                                        <option value="Sarawak">Sarawak</option>
                                        <option value="Perlis">Perlis</option>
                                        <option value="Malacca">Malacca</option>
                                    </select>
                                </div>
                                <div class="mb-2">
                                    <input type="text" class="form-control" name="city" placeholder="City" required>
                                </div>
                                <div class="mb-2">
                                    <input type="text" class="form-control" name="street" placeholder="Street" required>
                                </div>
                                <div class="mb-2">
                                    <input type="text" class="form-control" name="building" placeholder="Building">
                                </div>
                                <div>
                                    <input type="text" class="form-control" name="postal" placeholder="Postal Code" required>
                                </div>
                            </div>

                            <div>
                                <button type="submit" class="btn btn-success w-100">Submit Registration</button>
                            </div>
                        </form>

                        <div class="alert alert-danger error-message mt-2" style="display: none;">
                            <span></span>
                        </div>
                        <div class="alert alert-success success-message mt-2" style="display: none;">
                            <span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleForm(button) {
			const formId = button.getAttribute('data-form-id');
			
			// Toggle the form for the clicked button
            const form = document.getElementById(formId);
            form.classList.toggle('show');
        }

    </script>
	<div th:insert="~{fragments/footer}"></div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
