<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Submission Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .container-submit {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
			margin-bottom: 40px;
            padding: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            max-width: 600px;
            width: 100%;
            background-color: #f9f9f9;
        }
        h1 {
            font-weight: bold;
            color: #4CAF50;
        }
        h2 {
            font-weight: bold;
            color: #333;
        }
        p {
            color: #666;
        }
        img {
            margin-top: 20px;
            max-width: 100px;
            height: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
	<div th:insert="~{fragments/header}"></div>
    <div class="container container-submit">
        <img th:src="@{/img/success-icon.png}" alt="Success Icon">
        <h1>Submitted Successfully!</h1>
        <h2>Thank you, <span th:text="${name}">Name</span></h2>
        <p>Your message: <span th:text="${message}">Message</span></p>
        <p>We will get back to you at <span th:text="${email}">Email</span> soon.</p>
        <a href="/home" class="btn btn-primary mt-3">Go Back to Home</a>
    </div>
	<div th:insert="~{fragments/footer}"></div>
</body>
</html>
