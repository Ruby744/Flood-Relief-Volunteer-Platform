<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Create Project</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link rel="stylesheet" th:href="@{/css/admin.css}">
	</head>
	
	<body>
		<div th:insert="~{fragments/header}"></div>
		<div class="container form-container">
			<div class="row">
			    <form th:action="@{/admin-project}">
					<button class="btn btn-light" type="submit">
						<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16" transform="translate(0, -1)">
						  <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
						</svg>
						Back
					</button>
			    </form>	
			</div>
			<div class="row">
				<h2>New Project</h2>
				<div class="card-body">
					<form th:action="@{/admin-project}" th:object="${project}" method="POST">

						<div class="form-group">
							<label>Name</label>
							<input
								type="text"
								name="name"
								th:field="*{name}"
								class="form-control"
								placeholder="Enter Name"
								required/>
						</div>
					
						<div class="form-group">
							<label>Event</label>
							<input
								type="text"
								name="event"
								th:field="*{event}"
								class="form-control"
								placeholder="Enter Event"
								required/>
						</div>
						
						<div class="form-group">
							<label>Description</label>
							<input
								type="text"
								name="description"
								th:field="*{description}"
								class="form-control"
								placeholder="Enter Description"
								required/>
						</div>
			
						<div class="form-group">
							<label>Location</label>
							<input
								type="text"
								name="location"
								th:field="*{location}"
								class="form-control"
								placeholder="Enter Location"
								required/>
						</div>

						<div class="form-group">
							<label>Capacity</label>
							<input
								type="text"
								name="capacity"
								th:field="*{capacity}"
								class="form-control"
								placeholder="Enter Capacity"
								required/>
						</div>

						<div class="form-group">
							<label>Image</label>
							<input
								type="text"
								name="imageUrl"
								th:field="*{imageUrl}"
								class="form-control"
								placeholder="Enter Image"
								required/>
						</div>

						<button type="submit" class="btn btn-primary">Submit</button>
					</form>
				</div>
			</div>
		</div>
		<div th:insert="~{fragments/footer}"></div>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
		    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
		    crossorigin="anonymous"></script>
	</body>
</html>
